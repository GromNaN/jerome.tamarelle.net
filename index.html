		<script>
			function createArticleTemplate(article) {
				const date = new Date(article.published_timestamp);
				const formattedDate = date.toLocaleDateString("fr-FR", {year: "numeric", month: "long", day: "numeric"});

				const langPrefix = article.language ? `[${article.language.toUpperCase()}]` : '[EN]';

				return `
					<li data-lang="${article.language}">
						${langPrefix} <a href="${article.url}">${article.title}</a> <span data-translate="published_on">publié le</span> <time datetime="${date.toISOString()}">${formattedDate}</time>
					</li>
				`;
			}

			document.addEventListener("DOMContentLoaded", async () => {
				const articlesSection = document.getElementById("articles");
				const response = await fetch("https://dev.to/api/articles?username=gromnan");
				const articles = await response.json();

				const ul = document.createElement("ul");
				ul.style = "list-style: none; padding: 0;";

				articles
					.filter(article => article.title != '[Boost]')
					.forEach(article => {
						ul.innerHTML += createArticleTemplate(article);
					});

				articlesSection.appendChild(ul);
			});
		</script>
		<script>
			// Function to detect user's language
			function getUserLanguage() {
				return navigator.language || navigator.userLanguage;
			}

			// Function to get the language from the URL hash
			function getLanguageFromHash() {
				const hash = window.location.hash.substring(1); // Remove the '#' character
				return translations[hash] ? hash : null;
			}

			// Function to translate content based on language
			function translateContent(language) {
				const selectedLang = translations[language] || translations['en'];

				document.querySelectorAll('[data-translate]').forEach(element => {
					const key = element.getAttribute('data-translate');
					if (selectedLang[key]) {
						element.innerHTML = selectedLang[key];
					}
				});

				document.querySelectorAll('time').forEach(timeElement => {
					const date = new Date(timeElement.getAttribute('datetime'));
					timeElement.textContent = date.toLocaleDateString(language, { year: 'numeric', month: 'long', day: 'numeric' });
				});

				// Update the URL hash
				window.location.hash = language;
			}

			// Add language selection menu
			function addLanguageMenu() {
				const menu = document.createElement('div');
				menu.id = 'language-menu';
				menu.style = 'position: absolute; top: 10px; right: 10px;';

				const select = document.createElement('select');
				select.id = 'language-selector';

				Object.keys(translations).forEach(lang => {
					const option = document.createElement('option');
					option.value = lang;
					option.textContent = translations[lang]._lang;
					select.appendChild(option);
				});

				const userLang = getLanguageFromHash() || getUserLanguage().substring(0, 2);
				select.value = translations[userLang] ? userLang : 'fr';

				select.addEventListener('change', (event) => {
					translateContent(event.target.value);
				});

				menu.appendChild(select);
				document.body.appendChild(menu);
			}

			document.addEventListener('DOMContentLoaded', () => {
				const userLang = getLanguageFromHash() || getUserLanguage().substring(0, 2);
				translateContent(userLang);
				addLanguageMenu();
			});
		</script>
