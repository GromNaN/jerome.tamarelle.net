<!DOCTYPE HTML>
<html lang="fr">
	<head>
		<title>Jérôme Tamarelle - Web Developer - GromNaN</title>
		<meta name="description" content="Web Developer">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="assets/css/main.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
		<script type="application/ld+json">
			{
				"@context": "https://schema.org/",
				"@type": "Person",
				"name": "Jérôme Tamarelle",
					"homeLocation": "Paris, France",
				"jobTitle": "Web Developer",
				"url": "https://jerome.tamarelle.net/"
			}
		</script>
	</head>
	<body>
		<div id="wrapper">
			<div id="main">
				<header id="header">
					<h1>Jérôme Tamarelle</h1>
					<h2>Ma devise</h2>
					<p>Pouvoir <strong>Imaginer</strong> &bull; Devoir <strong>Anticiper</strong> &bull; Savoir <strong>Réagir</strong></p>
					<h2>Mes liens</h2>
					<nav>
						<ul>
							<li><a href="https://github.com/GromNaN" title="GitHub"><i class="fa-brands fa-github"></i>GitHub</a></li>
							<li><a href="https://dev.to/gromnan/" title="DEV.to"><i class="fa-brands fa-dev"></i>DEV.to</a></li>
							<li><a href="https://phpc.social/@gromnan" title="Mastodon"><i class="fa-brands fa-mastodon"></i>Mastodon</a></li>
							<li><a href="https://bsky.app/profile/jerome.tamarelle.net" title="Bluesky"><i class="fa-solid fa-cloud"></i>Bluesky</a></li>
							<li><a href="https://twitter.com/GromNaN" title="Twitter"><i class="fa-brands fa-twitter"></i>Twitter</a></li>
							<li><a href="https://stackoverflow.com/users/450789/gromnan" title="StackOverflow"><i class="fa-brands fa-stack-overflow"></i>StackOverflow</a></li>
							<li><a href="https://www.linkedin.com/in/jerometamarelle" title="LinkedIn"><i class="fa-brands fa-linkedin"></i>LinkedIn</a></li>
						</ul>
					</nav>
				</header>
				<section id="articles">
					<h2>Mes derniers articles</h2>
					<ul></ul>
				</section>
				<footer id="footer">
					<span>Design by GitHub Copilot</span>
				</footer>
			</div>
		</div>
		<script>
			window.onload = () => document.body.className = '';
		</script>
		<script>
			function createArticleTemplate(article) {
				const date = new Date(article.published_timestamp);
				const formattedDate = date.toLocaleDateString("fr-FR", {year: "numeric", month: "long", day: "numeric"});

				const langPrefix = article.language ? `[${article.language.toUpperCase()}]` : '[EN]';

				return `
					<li data-lang="${article.language}">
						${langPrefix} <a href="${article.url}">${article.title}</a> publié le <span>${formattedDate}</span>
					</li>
				`;
			}

			document.addEventListener("DOMContentLoaded", async () => {
				const articlesSection = document.getElementById("articles");
				const response = await fetch("https://dev.to/api/articles?username=gromnan");
				const articles = await response.json();

				const ul = document.createElement("ul");
				ul.style = "list-style: none; padding: 0;";

				articles
					.filter(article => article.title != '[Boost]')
					.forEach(article => {
						ul.innerHTML += createArticleTemplate(article);
					});

				articlesSection.appendChild(ul);
			});
		</script>
	</body>
</html>
